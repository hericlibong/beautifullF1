name: Refresh data after GP

# Déclenchement :
#   - Contrôle à 02:23, 08:23, 14:23 et 20:23 UTC
#   - workflow_dispatch (bouton "Run workflow" dans l'onglet Actions)
#   - repository_dispatch "scheduled-refresh" (point d'entrée pour un watchdog externe)
#
# Pourquoi quotidien et non "le lundi après la course" : un cron GitHub Actions
# est best-effort, il peut être retardé de plusieurs heures ou abandonné. Avec
# deux crons hebdomadaires, un cron sauté = un GP perdu en silence (incident du
# 28/09/2026, GP de Bakou). check_should_refresh.py compare les GP disputés aux
# GP publiés : les jours sans retard, le job s'arrête après l'étape de contrôle
# (~40 s) ; n'importe quel run ultérieur rattrape un run manqué.
#
# Pourquoi 14:23 et non 14:00 : GitHub cite le début d'heure comme le créneau le
# plus chargé et recommande de décaler. Mesuré sur les 36 premiers runs de ce
# workflow (planifiés à 14:00 pile) : aucun n'est parti à l'heure, retard médian
# 2 h 36, maximum 5 h 52. Voir doc/probleme-ouvert-fraicheur-des-donnees.md.
"on":
  schedule:
    - cron: "23 2,8,14,20 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [scheduled-refresh]

# Un clic manuel, un cron GitHub et un appel externe peuvent arriver presque
# simultanément. Les sérialiser évite deux builds et deux git push concurrents.
concurrency:
  group: refresh-after-gp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FASTF1_CACHE: ${{ github.workspace }}/.cache/fastf1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ne pas activer le cache pip de setup-python ici : les jours où les
      # données sont à jour, l'installation est volontairement sautée et le
      # dossier ~/.cache/pip n'existe pas. Le post-step de setup-python
      # transformerait alors à tort ce contrôle réussi en run rouge.

      # Compare les GP disputés aux GP déjà publiés. Le script échoue
      # explicitement si le calendrier est absent ou invalide.
      - name: Check whether published data is stale
        id: check
        run: python projects/dashboard/check_should_refresh.py

      - name: Skip notice
        if: steps.check.outputs.should-refresh != 'true' && github.event_name != 'workflow_dispatch'
        run: |
          echo "Données à jour — pipeline non lancé."
          echo "Raison : ${{ steps.check.outputs.reason }}"

      # L'installation lourde est inutile lors des contrôles quotidiens sans GP
      # manquant. workflow_dispatch reste volontairement un forçage complet.
      - name: Install dependencies
        if: steps.check.outputs.should-refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r requirements.txt

      # Cache du dossier FastF1 (sessions déjà téléchargées) pour accélérer les runs suivants
      - name: Cache FastF1
        if: steps.check.outputs.should-refresh == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .cache/fastf1
          key: fastf1-results-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fastf1-results-${{ runner.os }}-

      - name: Tests (unit only — skip Playwright E2E)
        if: steps.check.outputs.should-refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: pytest projects/dashboard/tests -q -m "not e2e"

      - name: Run pipeline
        if: steps.check.outputs.should-refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          for attempt in 1 2 3; do
            if python projects/dashboard/build_all.py; then
              exit 0
            fi
            echo "Pipeline en échec (essai $attempt/3)."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics-${{ github.run_id }}
          path: |
            projects/race_chart_builder/outputs/*.csv
            projects/season_summary_heatmap/outputs/*.csv
            projects/dashboard/web/data/dashboard_2026.json
          retention-days: 14

      - name: Commit and push if changed
        if: steps.check.outputs.should-refresh == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore(data): auto-refresh after GP (run #${{ github.run_number }})"
            git push
          else
            echo "Aucun changement à pousser."
          fi

      # Contrôler le résultat public même les jours sans reconstruction : un
      # push réussi ne prouve pas que Pages sert effectivement les bons fichiers.
      - name: Verify public data after deployment
        run: python projects/dashboard/verify_publication.py
